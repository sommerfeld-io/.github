---
x-volumes: &volumes
  - /etc/timezone:/etc/timezone:ro
  - /etc/localtime:/etc/localtime:ro
  - project-root-volume:/workspaces/.github
x-workdir: &default-workdir /workspaces/.github
x-tty: &tty true

volumes:

  project-root-volume:
    driver: local
    driver_opts:
      type: none
      device: .
      o: bind

services:

  lint-yaml:
    image: cytopia/yamllint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: &tty true

  lint-workflows:
    image: rhysd/actionlint:1.7.12
    user: root
    volumes: *volumes
    working_dir: *default-workdir
    command:
      - -color
      - .github/workflows/codeql.yml
      - .github/workflows/dev-environment.yml
      - .github/workflows/housekeeping-issues.yml
      - .github/workflows/housekeeping-labels.yml
      - .github/workflows/lib-release-code.yml
      - .github/workflows/pipeline.yml
      - .github/workflows/release.yml
    tty: *tty

  lint-filenames:
    image: lslintorg/ls-lint:1.11.2
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  lint-folders:
    image: sommerfeldio/folderslint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  markdown-links:
    image: lycheeverse/lychee:latest
    user: root
    volumes: *volumes
    working_dir: *default-workdir
    command: --config .lychee.toml .
    tty: *tty
